name: Stop local server
description: Stops a server started by the router action's run-local.

inputs:
  pid-file:
    description: Path to the PID file written by router's start step.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        PID_FILE: ${{ inputs.pid-file }}
      run: |
        if [[ -n "$PID_FILE" && -f "$PID_FILE" ]]; then
          kill "$(cat "$PID_FILE")" 2>/dev/null || true
        fi
